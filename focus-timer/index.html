<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Focus Timer</h1>
      <div class="mode-tabs">
        <button class="mode-btn active" data-mode="work">Focus</button>
        <button class="mode-btn" data-mode="short">Short Break</button>
        <button class="mode-btn" data-mode="long">Long Break</button>
      </div>
    </header>

    <main>
      <div class="timer-wrap">
        <svg class="ring" viewBox="0 0 240 240">
          <circle class="ring-bg" cx="120" cy="120" r="108"></circle>
          <circle class="ring-progress" cx="120" cy="120" r="108"></circle>
        </svg>
        <div class="timer-center">
          <div class="time" id="time">25:00</div>
          <div class="current-task" id="currentTask">No task selected</div>
        </div>
      </div>

      <div class="controls">
        <button id="resetBtn" class="ctrl-btn secondary" title="Reset">&#8634;</button>
        <button id="startBtn" class="ctrl-btn primary">Start</button>
        <button id="skipBtn" class="ctrl-btn secondary" title="Skip">&#9197;</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="sessionsToday">0</span>
          <span class="stat-label">sessions today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="focusMinutes">0</span>
          <span class="stat-label">focus minutes</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="streak">0</span>
          <span class="stat-label">streak</span>
        </div>
      </div>

      <section class="tasks">
        <h2>Tasks</h2>
        <form id="taskForm" class="task-form">
          <input type="text" id="taskInput" placeholder="What are you working on?" autocomplete="off">
          <button type="submit">Add</button>
        </form>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
